name: Continuous Deployment (Docker Build)

on:
  workflow_run:
    workflows: ["Continuous Integration (Code Quality)"]
    types: [completed]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Webhook Pipeline Images
        run: |
          docker build -t webhook-api:latest .
          echo "Docker Build Completed Successfully!"
