name: Continuous Integration (Code Quality)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Check Typescript Compilation (TSC)
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint || echo "Linting skipped (No script found)"
